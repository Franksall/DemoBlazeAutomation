
webdriver {
    driver = chrome
    autodownload = true
    base.url = "https://www.demoblaze.com/"

    timeouts {
        implicitlywait = 0
    }

    wait.for.timeout = 15000
}

serenity {
    project.name = "DemoBlaze - Web Automation Testing"
    take.screenshots = AFTER_EACH_STEP
    restart.browser.for.each = scenario
}

headless.mode = false

environments {

    default {
        webdriver {
            driver = chrome

            capabilities {
                browserName = "chrome"
                acceptInsecureCerts = false
                pageLoadStrategy = "normal"

                "goog:chromeOptions" {
                    args = [
                        "--start-maximized",
                        "--incognito",
                        "--disable-notifications"
                    ]
                }

                timeouts {
                    implicit = 0
                    script = 30000
                    pageLoad = 30000
                }
            }
        }
    }

    chrome {
        webdriver {
            driver = chrome

            capabilities {
                browserName = "chrome"
                acceptInsecureCerts = false
                pageLoadStrategy = "normal"

                "goog:chromeOptions" {
                    args = [
                        "--start-maximized",
                        "--incognito",
                        "--disable-notifications"
                    ]
                }

                timeouts {
                    implicit = 0
                    script = 30000
                    pageLoad = 30000
                }
            }
        }
    }

    edge {
        webdriver {
            driver = edge

            capabilities {
                browserName = "MicrosoftEdge"
                acceptInsecureCerts = false
                pageLoadStrategy = "normal"

                "ms:edgeOptions" {
                    args = [
                        "--start-maximized",
                        "--inprivate",
                        "--disable-notifications"
                    ]
                }

                timeouts {
                    implicit = 0
                    script = 30000
                    pageLoad = 30000
                }
            }
        }
    }

    firefox {
        webdriver {
            driver = firefox

            capabilities {
                browserName = "firefox"
                acceptInsecureCerts = false
                pageLoadStrategy = "normal"

                "moz:firefoxOptions" {
                    args = [
                        "-private"
                    ]

                    prefs {
                        "dom.webnotifications.enabled" = false
                    }
                }

                timeouts {
                    implicit = 0
                    script = 30000
                    pageLoad = 30000
                }
            }
        }
    }
}
